<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLPI Ticket Viewer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎫 GLPI Ticket Viewer</h1>
            <p>Validação de Categorias - Ambiente de Teste</p>
        </header>
        <div class="stats" id="stats">
            <div>
                <div class="number" id="totalTickets">-</div>
                <div class="label">Total de Tickets</div>
            </div>
            <div>
                <div class="number" id="categorizedTickets">-</div>
                <div class="label">Com Categoria</div>
            </div>
            <div>
                <div class="number" id="uncategorizedTickets">-</div>
                <div class="label">Sem Categoria</div>
            </div>
        </div>
        <div class="filters">
            <select id="categoryFilter">
                <option value="">🏷️ Todas as categorias</option>
            </select>
            <select id="statusFilter">
                <option value="">📊 Todos os status</option>
                <option value="1">Novo</option>
                <option value="2">Em Progresso</option>
                <option value="3">Pendente</option>
                <option value="4">Solucionado</option>
                <option value="5">Fechado</option>
                <option value="6">Cancelado</option>
            </select>
            <input type="text" id="searchBox" placeholder="🔍 Buscar por ID ou título...">
            <button onclick="applyFilters()">Filtrar</button>
            <button onclick="resetFilters()" class="secondary">Limpar</button>
        </div>
        <div class="table-container">
            <table id="ticketsTable">
                <thead>
                    <tr>
                        <th style="width: 80px"><button class="th-btn" onclick="setSort('id')">ID</button></th>
                        <th><button class="th-btn" onclick="setSort('name')">Título</button></th>
                        <th style="width: 300px"><button class="th-btn" onclick="setSort('category_name')">Categoria</button></th>
                        <th style="width: 150px"><button class="th-btn" onclick="setSort('status_name')">Status</button></th>
                        <th style="width: 180px"><button class="th-btn" onclick="setSort('date_creation')">Data de abertura</button></th>
                        <th style="width: 180px"><button class="th-btn" onclick="setSort('date_mod')">Última atualização</button></th>
                    </tr>
                </thead>
                <tbody id="ticketsBody">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px;">Carregando tickets...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="pagination" id="pagination">
            <button disabled>◀ Anterior</button>
            <span>Página 1 de 1</span>
            <button disabled>Próximo ▶</button>
        </div>
    </div>
    <div id="ticketModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Ticket #</h2>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
