version: '3.8'

services:
  # GLPI Data Service V3
  glpi-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glpi-data-service-v3
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # IMPORTANTE: No Docker, localhost = container, não o Windows!
      # Use host.docker.internal para acessar o host Windows

      # PostgreSQL Configuration (usado pelo código Python em config.py)
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

      # GLPI DTIC
      - GLPI_DTIC_URL=${GLPI_DTIC_URL}
      - GLPI_DTIC_APP_TOKEN=${GLPI_DTIC_APP_TOKEN}
      - GLPI_DTIC_USER_TOKEN=${GLPI_DTIC_USER_TOKEN}

      # GLPI SIS (opcional)
      - GLPI_SIS_URL=${GLPI_SIS_URL:-}
      - GLPI_SIS_APP_TOKEN=${GLPI_SIS_APP_TOKEN:-}
      - GLPI_SIS_USER_TOKEN=${GLPI_SIS_USER_TOKEN:-}

      # App settings
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO

    volumes:
      # Persist logs
      - ./logs:/app/logs

      # Mount .env file
      - ./.env:/app/.env:ro

    networks:
      - glpi-network

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Depends on database
    depends_on:
      - postgres

  # PostgreSQL Container
  postgres:
    image: postgres:15-alpine
    container_name: glpi-postgres-v3
    restart: unless-stopped
    environment:
      - POSTGRES_DB=glpi_data
      - POSTGRES_USER=glpi_user
      - POSTGRES_PASSWORD=glpi_secure_2024
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v3:/var/lib/postgresql/data
    networks:
      - glpi-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U glpi_user -d glpi_data" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  glpi-network:
    driver: bridge

volumes:
  postgres_data_v3:
    driver: local
