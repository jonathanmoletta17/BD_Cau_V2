services:
  # ==========================================
  # Core Infrastructure
  # ==========================================
  core-db:
    image: postgres:15-alpine
    # build:
    #   context: ./glpi-db
    #   dockerfile: Dockerfile
    container_name: glpi-core-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
    ports:
      - "5433:5432"  # Changed from 5432 to avoid conflict with other projects
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glpi_user} -d ${POSTGRES_DB:-glpi_data}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend Services
  # ==========================================
  core-api:
    build:
      context: ./glpi-data-service
      dockerfile: Dockerfile
    container_name: glpi-core-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=glpi-core-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - GLPI_DTIC_URL=${GLPI_DTIC_URL}
      - GLPI_DTIC_APP_TOKEN=${GLPI_DTIC_APP_TOKEN}
      - GLPI_DTIC_USER_TOKEN=${GLPI_DTIC_USER_TOKEN}
      - GLPI_SIS_URL=${GLPI_SIS_URL:-}
      - GLPI_SIS_APP_TOKEN=${GLPI_SIS_APP_TOKEN:-}
      - GLPI_SIS_USER_TOKEN=${GLPI_SIS_USER_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - ./glpi-data-service/logs:/app/logs
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # [NEW] Real-Time Sync Service
  glpi-sync:
    build:
      context: ./glpi-data-service
      dockerfile: Dockerfile
    container_name: glpi-core-sync
    restart: unless-stopped
    # Use the same image but override command to run daemon
    command: [ "python", "-u", "scripts/daemon_sync.py" ]
    environment:
      - POSTGRES_HOST=glpi-core-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - GLPI_DTIC_URL=${GLPI_DTIC_URL}
      - GLPI_DTIC_APP_TOKEN=${GLPI_DTIC_APP_TOKEN}
      - GLPI_DTIC_USER_TOKEN=${GLPI_DTIC_USER_TOKEN}
      - GLPI_SIS_URL=${GLPI_SIS_URL:-}
      - GLPI_SIS_APP_TOKEN=${GLPI_SIS_APP_TOKEN:-}
      - GLPI_SIS_USER_TOKEN=${GLPI_SIS_USER_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - ./glpi-data-service:/app
      - ./glpi-data-service/logs:/app/logs
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy

  # ==========================================
  # Frontend Applications
  # ==========================================
  # NOTE: All frontend services are NOT IMPLEMENTED yet (empty folders)
  # See: docs/frontend/STATUS.md for details and roadmap

  # DTIC Dashboard - Porta 3001 (Main Dashboard)
  view-dtic:
    build:
      context: ./glpi-dtic-dashboard
      dockerfile: Dockerfile
    container_name: glpi-view-dtic
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - app_network
    depends_on:
      - core-api

  # SIS Smart Search - Porta 3005 (Buscador SIS - IMPLEMENTADO)
  view-sis-search:
    build:
      context: ./glpi-sis-smart-search
      dockerfile: Dockerfile
    container_name: glpi-view-sis-search
    restart: unless-stopped
    ports:
      - "3005:80"
    networks:
      - app_network
    depends_on:
      - core-api

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
