services:
  # ==========================================
  # Core Infrastructure
  # ==========================================
  core-db:
    # image: postgres:15-alpine
    build:
      context: ./glpi-db
      dockerfile: Dockerfile
    container_name: glpi-core-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glpi_user} -d ${POSTGRES_DB:-glpi_data}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend Services
  # ==========================================
  core-api:
    build:
      context: ./glpi-data-service
      dockerfile: Dockerfile
    container_name: glpi-core-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - GLPI_PROD_URL=${GLPI_PROD_URL}
      - GLPI_PROD_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
      - GLPI_PROD_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
      - GLPI_SIS_URL=${GLPI_SIS_URL:-}
      - GLPI_SIS_APP_TOKEN=${GLPI_SIS_APP_TOKEN:-}
      - GLPI_SIS_USER_TOKEN=${GLPI_SIS_USER_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - ./glpi-data-service/logs:/app/logs
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # [NEW] Real-Time Sync Service
  glpi-sync:
    build:
      context: ./glpi-data-service
      dockerfile: Dockerfile
    container_name: glpi-core-sync
    restart: unless-stopped
    # Use the same image but override command to run daemon
    command: [ "python", "-u", "scripts/daemon_sync.py" ]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - GLPI_PROD_URL=${GLPI_PROD_URL}
      - GLPI_PROD_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
      - GLPI_PROD_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
      - GLPI_SIS_URL=${GLPI_SIS_URL:-}
      - GLPI_SIS_APP_TOKEN=${GLPI_SIS_APP_TOKEN:-}
      - GLPI_SIS_USER_TOKEN=${GLPI_SIS_USER_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - ./glpi-data-service/logs:/app/logs
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy

  # ==========================================
  # Frontend Applications
  # ==========================================

  # DTIC Dashboard - Porta 3006 (3005 realocada para SIS Smart Search)
  view-dtic:
    build:
      context: ./glpi-dtic-dashboard/frontend
      dockerfile: ../Dockerfile
    container_name: glpi-view-dtic
    restart: unless-stopped
    ports:
      - "3006:80"
    networks:
      - app_network
    depends_on:
      - core-api

  # SIS Dashboard - Porta 3001
  view-sis:
    build:
      context: ./glpi-sis-dashboard/frontend
      dockerfile: ../Dockerfile
    container_name: glpi-view-sis
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - app_network
    depends_on:
      - core-api

  # DTIC Smart Search - Porta 3002
  view-dtic-search:
    build:
      context: ./glpi-dtic-smart-search/frontend
      dockerfile: ../Dockerfile
    container_name: glpi-view-dtic-search
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - app_network
    depends_on:
      - core-api

  # SIS Smart Search - Porta 3005 (Requisito: Buscador SIS)
  view-sis-search:
    build:
      context: ./glpi-sis-smart-search/frontend
      dockerfile: ../Dockerfile
    container_name: glpi-view-sis-search
    restart: unless-stopped
    ports:
      - "3005:80"
    networks:
      - app_network
    depends_on:
      - core-api

  # SIS Carregadores Dashboard - Porta 3004
  view-sis-loader:
    build:
      context: ./glpi-sis-carregadores-dashboard/frontend
      dockerfile: ../Dockerfile
    container_name: glpi-view-sis-loader
    restart: unless-stopped
    ports:
      - "3004:80"
    networks:
      - app_network
    depends_on:
      - core-api
  # ==========================================
  # AI Agents (Unified Triage)
  # ==========================================

  # Triage Agent API (Logic Center)
  agent-triage-api:
    build:
      context: ./agents/triage
      dockerfile: Dockerfile
    container_name: glpi-triage-api
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002", "--reload" ]
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:9000/v1}
      - INFERENCE_SERVER_URL=${LLM_BASE_URL:-http://host.docker.internal:9000/v1}
      - LLM_MODEL=${LLM_MODEL_NAME:-llama3.1}
      - GLPI_PROD_URL=${GLPI_PROD_URL}
      - GLPI_PROD_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
      - GLPI_PROD_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
      - GLPI_TEST_URL=${GLPI_TEST_URL}
      - GLPI_TEST_APP_TOKEN=${GLPI_TEST_APP_TOKEN}
      - GLPI_TEST_USER_TOKEN=${GLPI_TEST_USER_TOKEN}
      - OPENER_TARGET_ENV=${OPENER_TARGET_ENV:-test}
      - MOCK_AUTH_ENABLED=${MOCK_AUTH_ENABLED:-false}
      - MOCK_AUTH_USER=${MOCK_AUTH_USER:-glpi}
      - MOCK_AUTH_PASS=${MOCK_AUTH_PASS:-glpi}
      - PYTHONPATH=/app
    volumes:
      - ./agents/triage:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

  # Triage Agent UI (Chat Interface)
  agent-triage-ui:
    build:
      context: ./agents/triage
      dockerfile: Dockerfile
    container_name: glpi-triage-ui
    command: [ "chainlit", "run", "ui.py", "--host", "0.0.0.0", "--port", "8000", "--headless", "-w" ]
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:9000/v1}
      - INFERENCE_SERVER_URL=${LLM_BASE_URL:-http://host.docker.internal:9000/v1}
      - LLM_MODEL=${LLM_MODEL_NAME:-llama3.1}
      - GLPI_PROD_URL=${GLPI_PROD_URL}
      - GLPI_PROD_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
      - GLPI_PROD_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
      - GLPI_TEST_URL=${GLPI_TEST_URL}
      - GLPI_TEST_APP_TOKEN=${GLPI_TEST_APP_TOKEN}
      - GLPI_TEST_USER_TOKEN=${GLPI_TEST_USER_TOKEN}
      - OPENER_TARGET_ENV=${OPENER_TARGET_ENV:-test}
      - MOCK_AUTH_ENABLED=${MOCK_AUTH_ENABLED:-false}
      - MOCK_AUTH_USER=${MOCK_AUTH_USER:-glpi}
      - MOCK_AUTH_PASS=${MOCK_AUTH_PASS:-glpi}
      - PYTHONPATH=/app
      - CHAINLIT_PORT=8000
    volumes:
      - ./agents/triage:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
