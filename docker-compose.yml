services:
  # ==========================================
  # ARCHIVED 2025-12-28: Agent services deprecated
  # ollama, nim-llm, and backend removed
  # See: archive/agent_v4_deprecated/
  # ==========================================



  # ==========================================
  # 2. State Management (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: glpi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # 5. Core Infrastructure (Legacy/DB)
  # ==========================================
  core-db:
    build:
      context: ./glpi-db-services/glpi-db
      dockerfile: Dockerfile
    container_name: glpi-core-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glpi_user} -d ${POSTGRES_DB:-glpi_data}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 6. Legacy Sync Services (Python)
  # ==========================================
  glpi-sync-dtic:
    build:
      context: .
      dockerfile: glpi-db-services/glpi-sync-dtic/Dockerfile
    container_name: glpi-sync-dtic
    restart: unless-stopped
    command: [ "python", "-u", "scripts/daemon_sync.py" ]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - GLPI_PROD_URL_CONFIG=${GLPI_PROD_URL_CONFIG}
      - GLPI_PROD_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
      - GLPI_PROD_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - LOG_LEVEL=INFO
      - TZ=${TZ:-America/Sao_Paulo}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ./glpi-db-services/glpi-sync-dtic:/app/services/glpi-sync-dtic
      - ./glpi-db-services/common:/app/services/common
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy

  glpi-sync-sis:
    build:
      context: .
      dockerfile: glpi-db-services/glpi-sync-'sis/'Dockerfile
    container_name: glpi-sync-sis
    restart: unless-stopped
    command: [ "python", "-u", "scripts/daemon_sync.py" ]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - GLPI_SIS_URL=${GLPI_SIS_URL:-}
      - GLPI_SIS_APP_TOKEN=${GLPI_SIS_APP_TOKEN:-}
      - GLPI_SIS_USER_TOKEN=${GLPI_SIS_USER_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - LOG_LEVEL=INFO
      - TZ=${TZ:-America/Sao_Paulo}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ./glpi-db-services/glpi-sync-sis:/app/services/glpi-sync-sis
      - ./glpi-db-services/common:/app/services/common
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy

  glpi-sis-api:
    build:
      context: .
      dockerfile: glpi-db-services/glpi-sync-sis/Dockerfile.api
    container_name: glpi-sis-api
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
    volumes:
      - ./glpi-db-services/glpi-sync-sis:/app/services/glpi-sync-sis
      - ./glpi-db-services/common:/app/services/common
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy

  glpi-dash-carregadores:
    build:
      context: ./glpi-dash-carregadores
      dockerfile: Dockerfile
    container_name: glpi-dash-carregadores
    restart: unless-stopped
    ports:
      - "3004:80"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3

  glpi-dtic-api:
    build:
      context: .
      dockerfile: glpi-db-services/glpi-sync-dtic/Dockerfile.api
    container_name: glpi-dtic-api
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - GLPI_DTIC_URL=${GLPI_PROD_URL_CONFIG}
      - GLPI_DTIC_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
      - GLPI_DTIC_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
    volumes:
      - ./glpi-db-services/glpi-sync-dtic:/app/services/glpi-sync-dtic
      - ./glpi-db-services/common:/app/services/common
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy

  glpi-dash-dtic:
    build:
      context: ./glpi-dash-dtic
      dockerfile: Dockerfile
    container_name: glpi-dash-dtic
    restart: unless-stopped
    ports:
      - "3006:80"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3

  glpi-search-dtic:
    build:
      context: ./glpi-search-dtic
      dockerfile: Dockerfile
    container_name: glpi-search-dtic
    restart: unless-stopped
    ports:
      - "3002:80"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3

  glpi-search-sis:
    build:
      context: ./glpi-search-sis
      dockerfile: Dockerfile
    container_name: glpi-search-sis
    restart: unless-stopped
    ports:
      - "3003:80"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
