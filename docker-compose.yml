services:
  # ==========================================
  # AI Inference Service (NVIDIA NIM)
  # ==========================================
  # ==========================================
  # AI Inference Service (Ollama Local)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - app_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # Core Infrastructure
  # ==========================================
  core-db:
    # image: postgres:15-alpine
    build:
      context: ./glpi-db
      dockerfile: Dockerfile
    container_name: glpi-core-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glpi_user} -d ${POSTGRES_DB:-glpi_data}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend Services
  # ==========================================
  # core-api:
  #   build:
  #     context: ./glpi-data-service
  #     dockerfile: Dockerfile
  #   container_name: glpi-core-api
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
  #     - POSTGRES_PORT=5432
  #     - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
  #     - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
  #     - GLPI_PROD_URL=${GLPI_PROD_URL_CONFIG}
  #     - GLPI_PROD_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
  #     - GLPI_PROD_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
  #     - GLPI_SIS_URL=${GLPI_SIS_URL:-}
  #     - GLPI_SIS_APP_TOKEN=${GLPI_SIS_APP_TOKEN:-}
  #     - GLPI_SIS_USER_TOKEN=${GLPI_SIS_USER_TOKEN:-}
  #     - PYTHONUNBUFFERED=1
  #     - LOG_LEVEL=INFO
  #     - TZ=${TZ:-America/Sao_Paulo}
  #   volumes:
  #     - ./glpi-data-service:/app
  #     - ./glpi-data-service/logs:/app/logs
  #   networks:
  #     - app_network
  #   depends_on:
  #     core-db:
  #       condition: service_healthy
  #   healthcheck:
  #     test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  glpi-sync-dtic:
    build:
      context: .
      dockerfile: services/glpi-sync-dtic/Dockerfile
    container_name: glpi-sync-dtic
    restart: unless-stopped
    command: [ "python", "-u", "scripts/daemon_sync.py" ]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      # DTIC Context Config
      - GLPI_PROD_URL_CONFIG=${GLPI_PROD_URL_CONFIG}
      - GLPI_PROD_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
      - GLPI_PROD_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - LOG_LEVEL=INFO
      - TZ=${TZ:-America/Sao_Paulo}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ./services/glpi-sync-dtic:/app/services/glpi-sync-dtic
      - ./services/common:/app/services/common
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy

  glpi-sync-sis:
    build:
      context: .
      dockerfile: services/glpi-sync-sis/Dockerfile
    container_name: glpi-sync-sis
    restart: unless-stopped
    command: [ "python", "-u", "scripts/daemon_sync.py" ]
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-glpi-core-db}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-glpi_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-glpi_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-glpi_data}
      # SIS Context Config
      - GLPI_SIS_URL=${GLPI_SIS_URL:-}
      - GLPI_SIS_APP_TOKEN=${GLPI_SIS_APP_TOKEN:-}
      - GLPI_SIS_USER_TOKEN=${GLPI_SIS_USER_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - LOG_LEVEL=INFO
      - TZ=${TZ:-America/Sao_Paulo}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ./services/glpi-sync-sis:/app/services/glpi-sync-sis
      - ./services/common:/app/services/common
    networks:
      - app_network
    depends_on:
      core-db:
        condition: service_healthy

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ollama_storage:
    driver: local
