services:
  glpi-dtic-api:
    build:
      context: .
      dockerfile: glpi-db-services/glpi-sync-dtic/Dockerfile.api
    container_name: glpi-dtic-api
    ports:
      - "8003:8003"
    environment:
      - POSTGRES_HOST=glpi-core-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=glpi_user
      - POSTGRES_PASSWORD=glpi_secure_2024
      - POSTGRES_DB=glpi_data
      - GLPI_DTIC_URL=${GLPI_PROD_URL_CONFIG}
      - GLPI_DTIC_APP_TOKEN=${GLPI_PROD_APP_TOKEN}
      - GLPI_DTIC_USER_TOKEN=${GLPI_PROD_USER_TOKEN}
    volumes:
      - ./glpi-db-services/glpi-sync-dtic:/app/services/glpi-sync-dtic
      - ./glpi-db-services/common:/app/services/common
    networks:
      - app_network
    restart: unless-stopped

  glpi-search-dtic:
    build:
      context: .
      dockerfile: glpi-search-dtic/Dockerfile
    container_name: glpi-search-dtic
    ports:
      - "3005:3000"
    environment:
      - VITE_API_URL=http://glpi-dtic-api:8003
      - VITE_API_PROXY_TARGET=http://glpi-dtic-api:8003
    volumes:
      - ./glpi-search-dtic:/app
      - /app/node_modules
    networks:
      - app_network
    depends_on:
      - glpi-dtic-api
    restart: unless-stopped

  glpi-dash-dtic:
    build:
      context: ./glpi-dash-dtic
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: glpi-dash-dtic
    ports:
      - "3006:80"
    environment:
      - VITE_API_URL=http://localhost:8003/sis
    volumes:
      - ./glpi-dash-dtic:/app
      - /app/node_modules
    networks:
      - app_network
    depends_on:
      - glpi-dtic-api
    restart: unless-stopped

networks:
  app_network:
    external: true
